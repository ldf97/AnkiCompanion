name: Build and freeze AnkiCompanion Recovery v1
on:
  push:
    branches: [main]
    paths:
      - 'recovery/**'
      - '.github/workflows/ankicompanion-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: immutable-ankicompanion-recovery-v1
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Compile small standalone Windows recovery executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./recovery/windows/build.ps1
          if (!(Test-Path recovery/windows/dist/AnkiCompanion-Recovery.exe)) { throw 'Recovery EXE missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-recovery-windows
          if-no-files-found: error
          path: recovery/windows/dist/AnkiCompanion-Recovery.exe
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK 35 exists
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'"
      - name: Build separate recovery APK with durable lab signing identity
        working-directory: recovery/android
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ../../experiments/pong-update-lab/android/demo-signing.p12.b64 > recovery-signing.p12
          export RECOVERY_KEYSTORE="$PWD/recovery-signing.p12"
          bash ../../android/gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/AnkiCompanion-Recovery.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-recovery-android
          if-no-files-found: error
          path: AnkiCompanion-Recovery.apk
  publish:
    needs: [windows,android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: immutable-recovery-*
          path: recovery-assets
          merge-multiple: true
      - name: Publish ONCE, never replace any recovery binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=ankicompanion-recovery-v1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Frozen recovery v1 already exists; never clobber or republish"
            exit 0
          fi
          test -s recovery-assets/AnkiCompanion-Recovery.exe
          test -s recovery-assets/AnkiCompanion-Recovery.apk
          gh release create "$tag" \
            recovery-assets/AnkiCompanion-Recovery.exe \
            recovery-assets/AnkiCompanion-Recovery.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "AnkiCompanion Recovery v1 (permanent safety hatch)" \
            --notes "Frozen independent recovery tools for Windows and Android. These files are never overwritten by AnkiCompanion updates. They download only official GitHub stable release packages; Windows verifies SHA-256 and Android also pins the original production signing certificate."
