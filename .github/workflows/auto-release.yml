name: Test, sign and publish new versions
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Candidate builds are automatic; stable publication needs explicit approval.
permissions:
  contents: read
concurrency:
  group: anki-main-release
  cancel-in-progress: true
jobs:
  decide:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_ENABLED: ${{ secrets.ANDROID_SIGNING_BUNDLE != '' || secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          elif [ "$SIGNING_ENABLED" != true ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null || echo '{}')"
            if printf '%s' "$release" | jq -e --arg sha "$GITHUB_SHA" \
              '.target_commitish == $sha and any(.assets[]?; .name == "AnkiCompanion-Android.apk")' >/dev/null; then
              echo 'needed=false' >> "$GITHUB_OUTPUT"
            else
              echo 'needed=true' >> "$GITHUB_OUTPUT"
            fi
          fi
  version:
    needs: [decide]
    if: needs.decide.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.set.outputs.version }}
      build: ${{ steps.set.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Human-visible version names and Android's integer versionCodes
          # have separate ordering requirements. v1.0.11 shipped with a
          # 10,000,000 versionCode; do not repeat the lower 1,000,0xx codes.
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ ! "$latest" =~ ^v1\.0\.([0-9]+)$ ]]; then
            echo "Unexpected latest release tag: $latest" >&2
            exit 1
          fi
          echo "version=1.0.$((${BASH_REMATCH[1]}+1))" >> "$GITHUB_OUTPUT"
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" \
            --pattern update.json --dir "$RUNNER_TEMP" --clobber
          python scripts/release_build_codes.py next \
            --previous "$RUNNER_TEMP/update.json" \
            --run-number "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
  release:
    needs: [decide, version]
    if: needs.decide.outputs.needed == 'true'
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      build: ${{ fromJSON(needs.version.outputs.build) }}
      publish: false
    secrets: inherit
