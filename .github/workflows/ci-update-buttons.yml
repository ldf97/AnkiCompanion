name: Two-device click-to-update acceptance
on:
  pull_request:
    paths:
      - 'android/**'
      - 'desktop/**'
      - 'companion/**'
      - 'tests/test_update_button_acceptance.py'
      - 'scripts/ci_android_update_button.sh'
      - 'scripts/ci_windows_electron_update.ps1'
      - 'updater/**'
      - 'scripts/build_windows.ps1'
      - '.github/workflows/ci-update-buttons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-update-button:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      ANKI_COMPANION_SKIN: study_companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-desktop.txt -r requirements-test.txt pyinstaller
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Click the Qt Update button without pairing
        run: python -m pytest -v tests/test_update_button_acceptance.py
      - name: Install Electron/NSIS updater and bundled Python study app
        shell: pwsh
        run: ./scripts/ci_windows_electron_update.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-click-update-evidence
          path: |
            test-results/update-buttons/
            packages/AnkiCompanion-Windows-Setup.exe
  android-update-button:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash scripts/ci_android_update_button.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-click-update-evidence
          path: test-results/update-buttons/android/
