# Connector bridge: owner-only GitHub issue comments dispatch the existing
# signed release workflow. Never interpret untrusted comment text as shell.
name: Owner-controlled signed release
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.repository == 'ldf97/AnkiCompanion' &&
      github.event.issue.number == 23 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      (startsWith(github.event.comment.body, '/prepare-release ') ||
       startsWith(github.event.comment.body, '/publish-release '))
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Validate owner comment (no shell interpolation)
        id: request
        shell: bash
        env:
          RELEASE_REQUEST: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os, re
          # Exact syntax: /prepare-release v0.1.2 build=3
          command = os.environ['RELEASE_REQUEST']
          match = re.fullmatch(r'/(prepare|publish)-release v(\d+\.\d+\.\d+) build=(\d+)', command)
          if not match:
              raise SystemExit('Invalid owner release command; only exact version/build format is accepted')
          operation, version, build = match.groups()
          if not (3 <= int(build) <= 999999):
              raise SystemExit('Build must be at least 3 and within Android version code limits')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('version=' + version, file=output)
              print('build=' + build, file=output)
              print('publish=' + ('true' if operation == 'publish' else 'false'), file=output)
          print('Validated ' + operation + ' request for v' + version + ' build ' + build)
          PY
      - name: Dispatch existing signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.request.outputs.version }}
          BUILD: ${{ steps.request.outputs.build }}
          PUBLISH: ${{ steps.request.outputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          # Explicit workflow_dispatch is permitted to start another workflow
          # with GITHUB_TOKEN. No secret keys or arbitrary issue text are passed.
          gh workflow run release-candidate.yml --ref main \
            --raw-field "version=$VERSION" \
            --raw-field "build=$BUILD" \
            --raw-field "publish=$PUBLISH"
          echo "Submitted release candidate workflow; publish=$PUBLISH"
