name: Deploy Google Cloud AnkiCompanion
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Approve Google Cloud infrastructure changes (false = plan only)"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  gcp:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: google-cloud-production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deployment/google-cloud
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_email: ${{ secrets.GCP_ACME_EMAIL }}
      TF_VAR_source_ref: ${{ github.sha }}
      TF_VAR_domain: ${{ secrets.GCP_DOMAIN }}
      GCP_TF_STATE_BUCKET: ${{ secrets.GCP_TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse incomplete Google Cloud credentials
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in TF_VAR_project_id TF_VAR_email TF_VAR_source_ref GCP_TF_STATE_BUCKET GCP_WIF_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            test -n "$${!name}" || { echo "Missing Google Cloud deployment setting $name"; exit 1; }
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Initialize persistent state and validate
        run: |
          terraform init -input=false -backend-config="bucket=$GCP_TF_STATE_BUCKET" -backend-config="prefix=ankicompanion/terraform"
          terraform validate -no-color
      - name: Review infrastructure plan
        run: terraform plan -input=false -out="$RUNNER_TEMP/companion.plan"
      - name: Apply after owner approval
        if: inputs.apply
        run: terraform apply -input=false "$RUNNER_TEMP/companion.plan"
      - name: Output HTTPS server URL
        if: inputs.apply
        run: terraform output https_url
