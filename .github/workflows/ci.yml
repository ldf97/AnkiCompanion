name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      ANKI_COMPANION_SKIN: study_companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: pip install -r requirements-desktop.txt -r requirements-test.txt
      - run: python scripts/make_public_fixture.py
      - run: python -m pytest -v --junitxml=test-results/ci-python.xml tests
      - run: python scripts/check_tray.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-evidence
          path: test-results/
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - working-directory: android
        env:
          APP_VERSION_NAME: 0.1.1
          APP_VERSION_CODE: ${{ github.run_number }}
        run: bash gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-development-package
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      ANKI_COMPANION_SKIN: study_companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-desktop.txt -r requirements-test.txt pyinstaller
      - run: python scripts/check_tray.py
      - shell: pwsh
        run: ./scripts/build_windows.ps1
      - shell: pwsh
        run: |
          $installer=Start-Process packages/AnkiCompanion-Windows-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=installer-smoke.log' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $server=Start-Process "$env:LOCALAPPDATA/Programs/AnkiCompanion/server/AnkiCompanionServer.exe" -PassThru -RedirectStandardOutput server-smoke.log -RedirectStandardError server-smoke-error.log
          try {
            $healthy=$false
            for ($i=0; $i -lt 30; $i++) {
              try { if ((Invoke-RestMethod http://127.0.0.1:8765/health).status -eq 'ok') { $healthy=$true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw 'Installed server did not become healthy' }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-development-installer
          path: |
            packages/AnkiCompanion-Windows-Setup.exe
            packages/*.ankiaddon
            test-results/
            *smoke*.log
            installer-smoke.log

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/check_android_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/emulator-evidence/

  ankidroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ankidroid/Anki-Android
          ref: d9bf072f814a0c37d30a694192593b31ff2df875
          path: ankidroid-upstream
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply reviewed companion overlay
        run: |
          python3 ankidroid_bridge/apply.py ankidroid-upstream
          printf 'enable_coverage=false\nenable_leak_canary=false\n' > ankidroid-upstream/local.properties
      - name: Build separate AnkiDroid companion edition
        working-directory: ankidroid-upstream
        run: bash gradlew --no-daemon :AnkiDroid:assembleFullDebug -Dorg.gradle.jvmargs=-Xmx4g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ankidroid-companion-development
          path: |
            ankidroid-upstream/AnkiDroid/build/outputs/apk/full/debug/*.apk
            ankidroid-upstream/AnkiDroid/build/reports/
