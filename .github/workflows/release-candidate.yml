name: Prepare signed release candidate
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build:
        required: true
        type: number
      publish:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version, for example 0.2.0
        required: true
        type: string
      build:
        description: Android build number greater than every prior release
        required: true
        type: number
      publish:
        description: Publish this signed candidate as a stable GitHub Release (after device acceptance)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    if: github.ref == 'refs/heads/main'
    environment: signing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with persistent release key
        working-directory: android
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION_NAME: ${{ inputs.version }}
          APP_VERSION_CODE: ${{ inputs.build }}
        run: |
          if [ -z "$SIGNING_BUNDLE" ] && [ -z "$KEYSTORE_BASE64" ]; then
            echo "No persistent Android release key configured: Windows-only release."
            exit 0
          fi
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "$SIGNING_BUNDLE" ]; then
            python3 - <<'PY'
          import base64,json,os,pathlib
          bundle=json.loads(base64.b64decode(os.environ['SIGNING_BUNDLE'],validate=True))
          data=base64.b64decode(bundle['keystore_base64'],validate=True)
          pathlib.Path(os.environ['RUNNER_TEMP'],'release.jks').write_bytes(data)
          for name,key in [('store-password','store_password'),('key-password','key_password'),('key-alias','alias')]:
              pathlib.Path(os.environ['RUNNER_TEMP'],name).write_text(bundle[key])
          PY
            export ANDROID_STORE_PASSWORD="$(cat "$RUNNER_TEMP/store-password")"
            export ANDROID_KEY_PASSWORD="$(cat "$RUNNER_TEMP/key-password")"
            export ANDROID_KEY_ALIAS="$(cat "$RUNNER_TEMP/key-alias")"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
          fi
          trap 'rm -f "$ANDROID_KEYSTORE" "$RUNNER_TEMP/store-password" "$RUNNER_TEMP/key-password" "$RUNNER_TEMP/key-alias"' EXIT
          bash gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p ../candidate
          cp app/build/outputs/apk/release/app-release.apk ../candidate/AnkiCompanion-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android
          if-no-files-found: ignore
          path: candidate/
  windows:
    if: github.ref == 'refs/heads/main'
    environment: signing
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-desktop.txt pyinstaller
      - name: Build and sign installer
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
        run: |
          $ErrorActionPreference='Stop'
          $cert=$null
          $path=Join-Path $env:RUNNER_TEMP publisher.pfx
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String($env:PFX_BASE64))
            $password=ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert=Get-PfxCertificate -FilePath $path -Password $password
          }
          try {
            $thumbprint=if ($cert) { $cert.Thumbprint } else { '' }
            @{version=$env:RELEASE_VERSION;build=[int]$env:RELEASE_BUILD;commit=$env:GITHUB_SHA;windows_signer_thumbprint=$thumbprint} | ConvertTo-Json | Set-Content VERSION.json -Encoding utf8NoBOM
            ./scripts/build_windows.ps1
            if ($cert) {
              $result=Set-AuthenticodeSignature -FilePath packages/AnkiCompanion-Windows-Setup.exe -Certificate $cert -HashAlgorithm SHA256 -TimestampServer http://timestamp.digicert.com
              if ($result.Status -ne 'Valid') { throw "Signature is not trusted: $($result.Status)" }
            } else {
              Write-Host 'No optional paid Windows signing certificate. Publishing with GitHub SHA-256 verified update manifest.'
            }
          } finally { Remove-Item $path -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: packages/AnkiCompanion-Windows-Setup.exe
  assemble:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          merge-multiple: true
          path: candidate
      - name: Hash exact candidate files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build }}
        run: |
          git archive --format=zip --output=candidate/AnkiCompanion-source.zip HEAD
          python scripts/release_manifest.py --directory candidate --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: candidate/
      # Publishing is an explicit dispatch choice, not an automatic side effect
      # of committing source code. Only the exact signed and hashed candidate
      # is eligible for publication.
  publish:
    if: inputs.publish
    needs: [assemble]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-candidate
          path: candidate
      - name: Verify exact signed release artifacts
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_BUILD: ${{ inputs.build }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          folder = pathlib.Path('candidate')
          manifest = json.loads((folder/'update.json').read_text())
          assert manifest['version'] == os.environ['EXPECTED_VERSION']
          assert manifest['build'] == int(os.environ['EXPECTED_BUILD'])
          assert manifest['commit'] == os.environ['EXPECTED_COMMIT']
          assert {'windows', 'source'}.issubset(manifest['assets'])
          assert set(manifest['assets']).issubset({'android','windows','source'})
          for platform, item in manifest['assets'].items():
              source = folder/item['filename']
              assert source.is_file() and source.stat().st_size == item['size'], platform
              assert hashlib.sha256(source.read_bytes()).hexdigest() == item['sha256'], platform
          print('Verified all release package hashes, version, build, and commit')
          PY
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Refusing to overwrite immutable release assets."
            exit 1
          fi
          assets=(candidate/AnkiCompanion-Windows-Setup.exe candidate/AnkiCompanion-source.zip candidate/update.json)
          if [ -f candidate/AnkiCompanion-Android.apk ]; then
            assets+=(candidate/AnkiCompanion-Android.apk)
          fi
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "AnkiCompanion $tag" --notes "GitHub checksum-verified Windows update. Android in-place updates are included when a persistent Android release signing key is configured." --latest

